<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Parcel</title>
<style>
:root{--bg:#f3f2fb;--card:#fff;--ink:#16162a;--mut:#6b6b85;--line:#e1e0f0;--acc:#2447f5;--on:#fff;--ok:#0a8a5b;--warn:#c25a00}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10101c;--card:#1a1a2c;--ink:#f0f0fa;--mut:#9a9ab6;--line:#2b2b44;--acc:#7b93ff;--on:#10101c;--ok:#4fd6a0;--warn:#ffb067}}
:root[data-theme="dark"]{--bg:#10101c;--card:#1a1a2c;--ink:#f0f0fa;--mut:#9a9ab6;--line:#2b2b44;--acc:#7b93ff;--on:#10101c;--ok:#4fd6a0;--warn:#ffb067}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:720px;margin:0 auto;padding:16px 16px 110px}
h1{font-size:30px;margin:0;font-weight:800;letter-spacing:-.02em}h2{font-size:18px;margin:24px 0 8px}
button{font-family:inherit}button:focus-visible,input:focus-visible{outline:2.5px solid var(--acc);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.pl{display:flex;background:var(--card);border-radius:99px;padding:4px;border:1px solid var(--line)}
.pl button{display:flex;gap:6px;align-items:center;border:0;background:transparent;color:var(--mut);padding:8px 14px;border-radius:99px;font:600 14px inherit;font-family:inherit;cursor:pointer}
.pl button[aria-pressed=true]{background:var(--acc);color:var(--on)}
svg{flex:none}.search{width:100%;padding:13px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.hero{display:flex;gap:14px;align-items:center;padding:18px;border-radius:24px;color:#fff;margin:16px 0 4px;cursor:pointer}
.hero .hn{font-size:22px;font-weight:800;line-height:1.1}.hero .hd{opacity:.9;font-size:13.5px;margin-top:4px}
.hero .get{background:#fff;color:#111}
.scroll{display:flex;gap:12px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.card{flex:none;width:112px;text-align:center;cursor:pointer}.card .tile{margin:0 auto 8px;width:76px;height:76px;border-radius:22px 22px 22px 6px}.card .nm{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.chip{flex:none;border:1.5px solid var(--line);background:transparent;color:var(--ink);padding:7px 14px;border-radius:99px;font:inherit;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.row{display:flex;gap:14px;align-items:center;padding:13px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.tile{position:relative;flex:none;width:54px;height:54px;border-radius:16px 16px 16px 4px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:22px;overflow:hidden}
.tile.big{width:68px;height:68px;border-radius:20px 20px 20px 6px}.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:var(--card)}
.grow{flex:1;min-width:0}.nm{font-weight:600;font-size:16px}.ds{color:var(--mut);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt{font-size:12.5px;color:var(--mut);margin-top:2px}.up{color:var(--warn);font-weight:600}.in{color:var(--ok);font-weight:600}
.get{flex:none;min-width:84px;background:var(--acc);color:var(--on);border:0;padding:9px 16px;border-radius:99px;font:600 14px inherit;font-family:inherit;cursor:pointer}
.get.alt{background:transparent;color:var(--acc);border:1.5px solid var(--acc)}.hero .get.alt{color:#fff;border-color:#fff}
.bar{height:4px;border-radius:4px;background:var(--line);margin-top:7px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .12s}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));background:var(--ink);padding:5px;border-radius:99px;display:flex;gap:2px;z-index:5}
nav button{display:flex;gap:6px;align-items:center;border:0;background:transparent;color:var(--bg);padding:10px 16px;border-radius:99px;font:600 14px inherit;font-family:inherit;cursor:pointer;opacity:.7}
nav button[aria-selected=true]{background:var(--bg);color:var(--ink);opacity:1}
.badge{background:var(--warn);color:#fff;border-radius:99px;padding:0 7px;font-size:12px}
.banner{display:flex;gap:12px;align-items:center;padding:14px;border:1.5px solid var(--acc);border-radius:16px;background:var(--card);margin:0 0 14px}.banner[hidden]{display:none}
#sheet{position:fixed;inset:0;background:rgba(10,10,30,.55);display:none;align-items:flex-end;justify-content:center;z-index:9}
#sheet.on{display:flex}.pane{background:var(--card);width:100%;max-width:720px;max-height:90%;overflow:auto;border-radius:24px 24px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px))}
.shots{display:flex;gap:10px;overflow-x:auto;margin:12px -18px 4px;padding:0 18px;scrollbar-width:none}.shots img{height:260px;border-radius:14px;flex:none;background:var(--line)}
.og{width:100%;border-radius:14px;margin:12px 0 4px;background:var(--line)}
.var{display:flex;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}.var .fn{flex:1;min-width:0;word-break:break-all;font-size:13px}
.best{color:var(--ok);font-weight:600;font-size:12px}.x{float:right;background:none;border:0;color:var(--mut);font-size:28px;cursor:pointer}
.empty{color:var(--mut);padding:30px 0;text-align:center}.set p{max-width:56ch}.net div{padding:6px 0;border-bottom:1px solid var(--line)}
#toast{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));max-width:480px;margin:0 auto;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;display:none;z-index:20}
</style></head><body><main>
<div class="banner" id="selfup" hidden></div>
<section id="v-store">
 <div class="top"><h1>Parcel</h1><div class="pl" role="group" aria-label="Platform"></div></div>
 <input id="q" class="search" type="search" placeholder="Search apps" aria-label="Search apps">
 <div id="home"></div>
</section>
<section id="v-lib" hidden></section>
<section id="v-set" hidden class="set">
 <h1>Settings</h1>
 <h2>Appearance</h2><div class="chips" id="themes"></div>
 <h2>Connection</h2><p class="mt">If downloads fail, check which GitHub services this network can reach.</p>
 <button class="get alt" data-act="net">Test connection</button><div class="net" id="netres"></div>
 <h2>About</h2><p>Parcel installs open-source apps straight from their developers' GitHub releases. No accounts, no tracking, no server of ours. <span id="ver"></span></p>
 <button class="get alt" data-act="selfcheck">Check for Parcel update</button>
</section>
</main>
<nav role="tablist"></nav>
<div id="sheet" role="dialog" aria-modal="true"><div class="pane" id="pane"></div></div><div id="toast" role="status"></div>
<script>
const REPO="__REPO__",BRANCH="__BRANCH__",HAS_REPO=!REPO.startsWith("__");
const SELF={id:REPO,name:"Parcel",pkg:"com.parcel.store"};let SELFUP=null,SELFVER="";
const P=window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform()?(Capacitor.Plugins.Parcel||Capacitor.registerPlugin("Parcel")):null;
let APPS=[],INST={},DL={},plat="phone",cat="All",tab="store",openId=null,busy=null,OSF="windows";const FILES=[];
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mb=b=>b?(b>=1e6?(b/1e6).toFixed(1)+" MB":Math.round(b/1e3)+" KB"):"";
const hue=s=>[...s].reduce((a,c)=>a*31+c.charCodeAt(0),7)%360;
const nums=s=>(String(s).match(/\d+/g)||[]).map(Number);
const cmp=(a,b)=>{for(let i=0;i<Math.max(a.length,b.length);i++){const d=(a[i]||0)-(b[i]||0);if(d)return d}return 0};
let ABIS=["arm64-v8a","armeabi-v7a"];const TOK={"arm64-v8a":/arm64|aarch64/,"armeabi-v7a":/armeabi|v7a|arm32/,"x86_64":/x86_64|x64/,"x86":/x86(?!_64)/};
const score=n=>{n=n.toLowerCase();const pen=/fdroid/.test(n)?.5:0;let hit=null;for(const k in TOK)if(TOK[k].test(n)){hit=k;break}if(!hit)return 4-pen;const i=ABIS.indexOf(hit);return(i<0?-5:10-i*2)-pen};
const best=a=>[...a.files].sort((x,y)=>score(y.n)-score(x.n))[0];
const AV=a=>`https://avatars.githubusercontent.com/${a.repo.split("/")[0]}?s=128`;
const inst=a=>a.plat!="pc"&&a.pkg&&INST[a.pkg],upd=a=>{const i=inst(a);return !!(i&&i.version&&cmp(nums(a.tag),nums(i.version))>0)};
const OSN={windows:"Windows",mac:"macOS",linux:"Linux"};
const svg=p=>`<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const IC={phone:svg('<rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/>'),tv:svg('<rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8M12 17v4"/>'),pc:svg('<rect x="4" y="5" width="16" height="11" rx="1.5"/><path d="M2 19h20"/>'),
store:svg('<path d="M4 7h16l-1 12H5L4 7z"/><path d="M9 7a3 3 0 016 0"/>'),lib:svg('<path d="M12 3v12m0 0l-4-4m4 4l4-4M4 20h16"/>'),set:svg('<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>')};
const PLN={phone:"Phone",tv:"TV",pc:"PC"};
let tt;const toast=m=>{const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(tt);tt=setTimeout(()=>t.style.display="none",4200)};
window.fb=i=>{const s=i.dataset.f;if(s&&i.src!==s){i.dataset.f="";i.src=s}else i.remove()};
const tile=(a,c)=>{const i=inst(a),src=(i&&i.icon)||a.icon||AV(a);return `<div class="tile ${c||""}" style="background:hsl(${hue(a.name)} 55% 42%)">${esc(a.name[0])}<img alt="" loading="lazy" src="${esc(src)}" data-f="${esc(AV(a))}" onerror="fb(this)"></div>`};
function btn(a,v){const d=DL[a.id],id=esc(a.id);
 if(d&&d.st=="dl")return `<button class="get alt" data-act="cancel">${d.p>0?Math.round(d.p*100)+"%":"…"} ✕</button>`;
 if(d&&d.st=="ready")return `<button class="get" data-act="install" data-id="${id}">Install</button>`;
 if(a.plat=="pc")return v?`<button class="get" data-act="get" data-id="${id}" data-v="${esc(v.n)}">Download</button>`:`<button class="get alt" data-act="sheet" data-id="${id}">Files</button>`;
 if(inst(a))return upd(a)?`<button class="get" data-act="get" data-id="${id}" data-v="${esc(v.n)}">Update</button>`:`<button class="get alt" data-act="open" data-id="${id}">Open</button>`;
 return `<button class="get" data-act="get" data-id="${id}" data-v="${esc(v.n)}">Get</button>`}
function status(a){if(a.plat=="pc")return `${esc(a.tag)} · ${esc(a.date)} · ${[...new Set(a.files.map(f=>OSN[f.os]))].join(", ")}`;
 const i=inst(a);return i?(upd(a)?`<span class="up">Update ${esc(a.tag)}</span> · installed ${esc(i.version)}`:`<span class="in">Installed</span> · ${esc(i.version)}`):`${esc(a.tag)} · ${mb(best(a).s)} · ${esc(a.date)}`}
const row=a=>`<div class="row" data-act="sheet" data-id="${esc(a.id)}">${tile(a)}<div class="grow"><div class="nm">${esc(a.name)}</div><div class="ds">${esc(a.desc)}</div><div class="mt">${status(a)}</div>${DL[a.id]&&DL[a.id].st=="dl"?`<div class="bar"><i style="width:${Math.round(DL[a.id].p*100)}%"></i></div>`:""}</div>${btn(a,a.plat=="pc"?null:best(a))}</div>`;
function paint(){
 $(".pl").innerHTML=Object.keys(PLN).map(k=>`<button data-p="${k}" aria-pressed="${k==plat}">${IC[k]}${PLN[k]}</button>`).join("");
 const U=APPS.filter(upd),I=APPS.filter(a=>inst(a)&&!upd(a));
 $("nav").innerHTML=[["store","Discover"],["lib","Library"],["set","Settings"]].map(([k,l])=>`<button role="tab" data-t="${k}" aria-selected="${k==tab}">${IC[k]}${l}${k=="lib"&&U.length?`<span class="badge">${U.length}</span>`:""}</button>`).join("");
 const L=APPS.filter(a=>a.plat==plat).sort((x,y)=>y.date.localeCompare(x.date)),q=$("#q").value.toLowerCase(),cs=["All",...new Set(L.map(a=>a.cat))];
 const F=L.filter(a=>(cat=="All"||a.cat==cat)&&(a.name+a.desc).toLowerCase().includes(q)),home=!q&&cat=="All"&&L.length;
 let h="";if(home){const a=L[0],k=hue(a.name);h+=`<div class="hero" data-act="sheet" data-id="${esc(a.id)}" style="background:linear-gradient(135deg,hsl(${k} 62% 40%),hsl(${(k+50)%360} 70% 24%))">${tile(a,"big")}<div class="grow"><div class="hn">${esc(a.name)}</div><div class="hd">${esc(a.desc)}</div></div>${btn(a,a.plat=="pc"?null:best(a))}</div>
 <h2>Fresh releases</h2><div class="scroll">${L.slice(1,9).map(a=>`<div class="card" data-act="sheet" data-id="${esc(a.id)}">${tile(a)}<div class="nm">${esc(a.name)}</div><div class="mt">${esc(a.tag)}</div></div>`).join("")}</div>`}
 h+=`<div class="chips">${cs.map(c=>`<button class="chip" aria-pressed="${c==cat}" data-c="${c}">${c}</button>`).join("")}</div>`+(F.length?F.map(row).join(""):'<p class="empty">No apps match that search.</p>');
 $("#home").innerHTML=h;
 $("#v-lib").innerHTML=`<h1>Library</h1>`+(!P?'<p class="empty">Installed apps and updates appear here in the Android app.</p>':`<button class="get alt" data-act="check" style="width:100%;margin-top:12px">Check for updates</button>${U.length?`<h2>Updates</h2>${U.map(row).join("")}`:""}<h2>Installed</h2>${I.length?I.map(row).join(""):'<p class="empty">None of the apps in Parcel are installed yet.</p>'}`)+(FILES.length?`<h2>Saved this session</h2>${FILES.map(f=>`<div class="row" style="cursor:default"><div class="grow"><div class="nm">${esc(f.n)}</div><div class="mt">${esc(f.where)}</div></div></div>`).join("")}`:"");
 banner();if(openId)sheet(openId)}
function banner(){const el=$("#selfup");if(!SELFUP){el.hidden=true;return}const d=DL[SELF.id],id=esc(SELF.id);el.hidden=false;el.dataset.id=SELF.id;
 el.innerHTML=`<div class="grow"><div class="nm">Parcel ${esc(SELFUP)} is available</div><div class="mt">You have ${esc(SELFVER)}.</div>${d&&d.st=="dl"?`<div class="bar"><i style="width:${Math.round(d.p*100)}%"></i></div>`:""}</div>`+(d&&d.st=="dl"?`<button class="get alt" data-act="cancel">${Math.round(d.p*100)}% ✕</button>`:d&&d.st=="ready"?`<button class="get" data-act="install" data-id="${id}">Install</button>`:`<button class="get" data-act="get" data-id="${id}">Update</button>`)}
function prog(id){const w=Math.round(DL[id].p*100);document.querySelectorAll(`[data-id="${CSS.escape(id)}"] .bar i`).forEach(i=>i.style.width=w+"%");document.querySelectorAll("[data-act=cancel]").forEach(b=>b.textContent=(w>0?w+"%":"…")+" ✕")}
function sheet(id){const a=APPS.find(x=>x.id==id),pc=a.plat=="pc",b=pc?null:best(a),d=DL[id];
 const avail=["windows","mac","linux"].filter(o=>a.files.some(f=>f.os==o)),os=avail.includes(OSF)?OSF:avail[0];
 const media=a.shots&&a.shots.length?`<div class="shots">${a.shots.map(s=>`<img loading="lazy" alt="" src="${esc(s)}" onerror="this.remove()">`).join("")}</div>`:`<img class="og" alt="" src="https://opengraph.githubassets.com/1/${esc(a.repo)}" onerror="this.remove()">`;
 const fl=pc?a.files.filter(f=>f.os==os):a.files;
 $("#pane").innerHTML=`<button class="x" aria-label="Close">×</button><div style="display:flex;gap:14px;align-items:center">${tile(a,"big")}<div><div class="nm" style="font-size:20px">${esc(a.name)}</div><div class="mt">${status(a)}</div></div></div>${media}<p>${esc(a.desc)}</p><p class="mt">Source: ${esc(a.repo)}${a.pkg?" · "+esc(a.pkg):""}</p>
 ${pc?`<p class="mt">Installers download to your phone's Downloads/Parcel folder. Copy them to your computer to install.</p><div class="chips">${avail.map(o=>`<button class="chip" aria-pressed="${o==os}" data-os="${o}">${OSN[o]}</button>`).join("")}</div>`:""}
 ${d&&d.st=="dl"?`<div class="bar"><i style="width:${Math.round(d.p*100)}%"></i></div>`:""}
 ${fl.map(v=>`<div class="var"><div class="fn">${esc(v.n)}<div class="mt">${mb(v.s)} ${v===b?'<span class="best">· recommended</span>':""}</div></div>${btn(a,v)}</div>`).join("")}`;
 if(!$("#sheet").classList.contains("on"))history.pushState({s:1},"");$("#pane").dataset.id=id;openId=id;$("#sheet").classList.add("on")}
const close=()=>{if(openId){openId=null;$("#sheet").classList.remove("on");if(history.state&&history.state.s)history.back()}};
addEventListener("popstate",()=>{if(openId){openId=null;$("#sheet").classList.remove("on")}});
async function get(a,v){
 if(!P)return window.open(v.u,"_blank");
 if(busy)return toast("One download at a time. Cancel or wait for the current one.");
 busy=a.id;DL[a.id]={st:"dl",p:0};paint();
 try{const r=await P.download({url:v.u,name:v.n,id:a.id,size:v.s,kind:a.plat=="pc"?"file":"apk"});busy=null;
  if(a.plat=="pc"){delete DL[a.id];FILES.unshift({n:v.n,where:r.saved});toast("Saved to "+r.saved);paint();return}
  DL[a.id]={st:"ready",path:r.path};paint();await install(a)}
 catch(e){busy=null;delete DL[a.id];paint();if(!/cancel/i.test(e.message||""))toast(e.message||"Download failed")}}
async function install(a){const d=DL[a.id];if(!d)return;try{const r=await P.install({path:d.path});if(r.needsPermission)toast("Allow installs from Parcel, then come back and tap Install.")}catch(e){toast("Could not open installer: "+e.message)}}
async function refreshInstalled(){if(!P)return;try{const r=await P.getInstalled({packages:APPS.filter(a=>a.plat!="pc").map(a=>a.pkg).filter(Boolean)});INST=r.apps||{};for(const a of APPS)if(inst(a)&&DL[a.id]&&DL[a.id].st=="ready")delete DL[a.id];paint();if(!busy&&!Object.keys(DL).length)P.clean().catch(()=>{})}catch(e){}}
async function live(a){const r=await fetch(`https://api.github.com/repos/${a.repo}/releases/latest`);if(r.status==403||r.status==429)throw new Error("rate");if(!r.ok)return;const j=await r.json();
 const ap=j.assets.filter(s=>/\.apk$/i.test(s.name)).map(s=>({n:s.name,s:s.size,u:s.browser_download_url}));if(ap.length)Object.assign(a,{tag:j.tag_name,date:j.published_at.slice(0,10),files:ap})}
async function check(){toast("Checking for updates…");try{for(const a of APPS.filter(inst))await live(a);paint();toast(APPS.filter(upd).length?"Updates found.":"Everything is up to date.")}catch(e){toast(e.message=="rate"?"GitHub rate limit reached. Try again in a few minutes.":"Could not reach GitHub.")}}
async function selfCheck(manual){if(!P||!HAS_REPO)return manual&&toast("Update checks work in the installed Android app.");try{const me=(await P.getInstalled({packages:[SELF.pkg]})).apps[SELF.pkg];if(!me)return;
 const r=await fetch(`https://api.github.com/repos/${REPO}/releases/latest`);if(!r.ok)return manual&&toast("Could not check for updates.");const j=await r.json();
 const ap=j.assets.filter(s=>/\.apk$/i.test(s.name)).map(s=>({n:s.name,s:s.size,u:s.browser_download_url}));
 if(ap.length&&cmp(nums(j.tag_name),nums(me.version))>0){SELF.files=ap;SELF.apks=ap;SELFUP=j.tag_name.replace(/^v/,"");SELFVER=me.version;paint()}else manual&&toast("Parcel is up to date.")}catch(e){manual&&toast("Could not check for updates.")}}
async function net(){const H=[["github.com (releases)","https://github.com/favicon.ico"],["api.github.com (fallback route)","https://api.github.com/zen"],["raw.githubusercontent.com (catalog)","https://raw.githubusercontent.com/octocat/Hello-World/master/README"],["avatars (icons)","https://avatars.githubusercontent.com/u/1?s=16"]];
 const el=$("#netres");el.innerHTML=H.map(h=>`<div>${h[0]}: testing…</div>`).join("");
 for(let i=0;i<H.length;i++){let ok=true;try{await fetch(H[i][1],{mode:"no-cors",cache:"no-store",signal:AbortSignal.timeout(8000)})}catch(e){ok=false}
  el.children[i].innerHTML=`${H[i][0]}: <b class="${ok?"in":"up"}">${ok?"reachable":"blocked or timed out"}</b>`}}
function theme(v){const r=document.documentElement;v=="auto"?r.removeAttribute("data-theme"):r.dataset.theme=v;try{localStorage.setItem("theme",v)}catch(e){}
 $("#themes").innerHTML=["auto","light","dark"].map(t=>`<button class="chip" data-th="${t}" aria-pressed="${t==v}">${t[0].toUpperCase()+t.slice(1)}</button>`).join("")}
const loadCatalog=async()=>{if(HAS_REPO){try{const r=await fetch(`https://raw.githubusercontent.com/${REPO}/${BRANCH}/www/apps.json`,{cache:"no-cache"});if(r.ok){const j=await r.json();if(Array.isArray(j)&&j.length)return j}}catch(e){}}return(await fetch("apps.json")).json()};
document.addEventListener("click",e=>{const t=e.target,b=t.closest("[data-act]");
 if(t.closest("nav button")){tab=t.closest("nav button").dataset.t;["store","lib","set"].forEach(k=>$("#v-"+k).hidden=k!=tab);return paint()}
 if(t.closest(".pl button")){plat=t.closest(".pl button").dataset.p;cat="All";return paint()}
 if(t.dataset.c){cat=t.dataset.c;return paint()}if(t.dataset.os){OSF=t.dataset.os;return sheet(openId)}if(t.dataset.th)return theme(t.dataset.th);
 if(t.classList.contains("x")||t.id=="sheet")return close();
 if(b){const k=b.dataset.act;if(k=="net")return net();if(k=="selfcheck")return selfCheck(true);if(k=="check")return check();if(k=="cancel")return P.cancel();
  const a=b.dataset.id==SELF.id?SELF:APPS.find(x=>x.id==b.dataset.id);if(!a)return;
  if(k=="sheet")return sheet(a.id);if(k=="get")return get(a,a.files.find(v=>v.n==b.dataset.v)||best(a));if(k=="install")return install(a);
  if(k=="open")return P.launch({package:a.pkg}).catch(()=>toast("Could not open the app."))}});
document.addEventListener("keydown",e=>{if(e.key=="Escape")close()});
document.addEventListener("visibilitychange",()=>{if(!document.hidden)refreshInstalled()});
$("#q").addEventListener("input",paint);
if(P)P.deviceInfo().then(r=>{if(r.abis&&r.abis.length){ABIS=r.abis;paint()}}).catch(()=>{});
if(P)P.addListener("progress",p=>{const d=DL[p.id];if(d&&d.st=="dl"){d.p=p.total>0?Math.min(1,p.loaded/p.total):0;prog(p.id)}});
let th="auto";try{th=localStorage.getItem("theme")||"auto"}catch(e){}theme(th);$("#ver").textContent=HAS_REPO?"":"";
loadCatalog().then(async j=>{APPS=j;paint();await refreshInstalled();selfCheck()}).catch(()=>toast("Could not load the catalog."));
</script></body></html>
