name: Refresh catalog
on:
  schedule: [{ cron: '17 3 * * *' }]
  workflow_dispatch:
permissions: { contents: write }
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scrape.py
      - name: Commit if changed
        run: |
          git config user.name "parcel-bot"
          git config user.email "parcel-bot@users.noreply.github.com"
          git add www/apps.json
          git diff --cached --quiet || (git commit -m "Refresh catalog" && git push)
