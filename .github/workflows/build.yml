name: Build APK
on:
  push: { branches: [main], tags: ['v*'] }
  workflow_dispatch:
permissions: { contents: write }
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - name: Configure repo and version
        run: |
          sed -i "s|__REPO__|${{ github.repository }}|g; s|__BRANCH__|${{ github.event.repository.default_branch }}|g" www/index.html
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V="0.0.${{ github.run_number }}"; fi
          echo "VERSION_NAME=$V" >> "$GITHUB_ENV"
      - run: npx cap sync android
      - name: Decode signing key
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build
        run: |
          cd android && chmod +x gradlew
          if [ -n "$KEYSTORE_PATH" ]; then ./gradlew assembleRelease; else ./gradlew assembleDebug; fi
          cp "$(find app/build/outputs/apk -name '*.apk' | head -1)" ../Parcel.apk
      - uses: actions/upload-artifact@v4
        with: { name: Parcel-APK, path: Parcel.apk }
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') && env.KEYSTORE_B64 != ''
        uses: softprops/action-gh-release@v2
        with: { files: Parcel.apk }
